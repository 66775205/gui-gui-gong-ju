plugins {
    id 'com.android.application'
}

android {
    namespace 'com.guigui.yeluzhinan'
    compileSdk 35

    defaultConfig {
        applicationId 'com.guigui.yeluzhinan'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    sourceSets {
        main.assets.srcDirs += ["$buildDir/generated/site-assets"]
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('ANDROID_KEYSTORE_PATH') ?: 'release.p12')
            storeType 'pkcs12'
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: 'yeluzhinan'
            keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('syncSiteAssets', Sync) {
    from(file('../..')) {
        include 'index.html', 'style.css', 'visual-refresh.css', 'app.js'
        include 'china-cities.js', 'china-districts.js', 'sw.js', 'manifest.webmanifest'
        include 'favicon-32.png', 'apple-touch-icon.png', 'icon.svg', 'icon-192.png', 'icon-512.png'
        include 'icon-maskable-192.png', 'icon-maskable-512.png', 'hero-fisher.jpg'
        include 'logo-hupao.png', 'logo-hupao-white.png'
        include 'lure-photos-clean/*.png', 'fish-photos-clean/*.png'
    }
    into "$buildDir/generated/site-assets/site"
}

tasks.named('preBuild').configure {
    dependsOn 'syncSiteAssets'
}
